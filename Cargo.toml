[package]
name = "streampipe"
version = "0.1.0"
edition = "2021"
authors = ["https://github.com/RockasMockas/streampipe"]
keywords = ["streaming", "video", "screenshare", "p2p", "obs"]
categories = ["network-programming"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/RockasMockas/streampipe"
description = "Broadcast video/audio p2p to friends using streaming software like OBS"
readme = "README.md"
rust-version = "1.91"
autobins = false

[lib]
name = "streampipe"
path = "src/lib.rs"

[[bin]]
name = "streampipe"
path = "src/main.rs"

[dependencies]
bytes = "1"
clap = { version = "4.4.10", features = ["derive"] }
hex = "0.4.3"
iroh = { version = "1.3.0", default-features = false, features = ["tls-ring"] }
iroh-tickets = "1.0.0"
noq = "1.0.0"
tokio = { version = "1.34.0", features = ["full"] }
tokio-util = "0.7.10"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
data-encoding = "2.9.0"
n0-error = "1.0.0"
str0m = { version = "0.24.1", default-features = false, features = [
  "rust-crypto",
] }
http = "1"
http-body-util = "0.1"
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio", "server", "http1"] }
socket2 = "0.6"

eframe = { version = "0.36", default-features = false, features = [
  "glow",
  "x11",
  "wayland",
  "default_fonts",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
duct = "1.1.1"
rand = "0.10"
tempfile = "3.8"

# Unix-only: `nix` does not compile on Windows, so it must not be a
# platform-independent dev-dependency.
[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.31", features = ["signal", "process"] }

[profile.release]
panic = "abort"
opt-level = "s"
codegen-units = 1
lto = true
debug = "none"
strip = true
